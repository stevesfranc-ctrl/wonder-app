<svg
  viewBox="0 0 800 600"
  xmlns="http://www.w3.org/2000/svg"
  fill="none"
>
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Floating background dots -->
  <g opacity="0.25">
    <circle cx="120" cy="90" r="1.5" fill="#94a3b8">
      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="0 20"
        dur="12s"
        repeatCount="indefinite"
        direction="alternate"
      />
    </circle>
    <circle cx="520" cy="120" r="1.5" fill="#94a3b8">
      <animateTransform
        attributeName="transform"
        type="translate"
        from="0 0"
        to="0 -25"
        dur="10s"
        repeatCount="indefinite"
        direction="alternate"
      />
    </circle>
  </g>

  <!-- Animated connection lines -->
  <g stroke="url(#gradient)" stroke-width="1.2" opacity="0.7">
    <path d="M120 90 L300 180 L520 120">
      <animate
        attributeName="stroke-dasharray"
        from="0,400"
        to="400,0"
        dur="4s"
        repeatCount="indefinite"
      />
    </path>
    <path d="M300 180 L400 420">
      <animate
        attributeName="stroke-dasharray"
        from="0,300"
        to="300,0"
        dur="5s"
        repeatCount="indefinite"
      />
    </path>
  </g>

  <!-- Animated market curve -->
  <path
    d="M100 350 C200 280, 350 400, 500 320 C620 260, 720 300, 780 250"
    stroke="url(#gradient)"
    stroke-width="2"
    fill="none"
    opacity="0.9"
  >
    <animate
      attributeName="stroke-dasharray"
      from="0,800"
      to="800,0"
      dur="6s"
      repeatCount="indefinite"
    />
  </path>

  <!-- Pulsing nodes -->
  <g>
    <circle cx="120" cy="90" r="4" fill="#22d3ee">
      <animate attributeName="r" values="4;6;4" dur="3s" repeatCount="indefinite" />
    </circle>

    <circle cx="300" cy="180" r="4" fill="#34d399">
      <animate attributeName="r" values="4;7;4" dur="4s" repeatCount="indefinite" />
    </circle>

    <circle cx="520" cy="120" r="4" fill="#22d3ee">
      <animate attributeName="r" values="4;6;4" dur="3.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Glow breathing -->
  <g opacity="0.4">
    <circle cx="300" cy="180" r="40" fill="url(#glow)">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="520" cy="120" r="30" fill="url(#glow)">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
