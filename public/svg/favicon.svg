<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#020617"/>

  <text
    x="50%"
    y="54%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-size="38"
  >
    👋🏾
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 32 32"
      to="20 32 32"
      dur="0.25s"
      begin="0s;wave.end+1.8s"
      id="wave"
      repeatCount="3"
      direction="alternate"
    />
  </text>
</svg>
